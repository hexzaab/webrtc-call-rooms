<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeerHub — WebRTC Rooms</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: radial-gradient(circle at top, #1e293b, #020617 55%); }
    .video-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
    .mirrored { transform:scaleX(-1); }
  </style>
</head>
<body class="min-h-screen text-slate-100">
<header class="border-b border-white/10 bg-slate-950/70 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
    <div class="flex items-center gap-3"><div class="grid h-10 w-10 place-items-center rounded-xl bg-indigo-500">◉</div><div><h1 class="font-bold">PeerHub</h1><p class="text-xs text-slate-400">Browser-to-browser calling</p></div></div>
    <button id="leaveBtn" class="hidden rounded-lg bg-rose-500 px-4 py-2 text-sm font-semibold">Leave room</button>
  </div>
</header>

<main class="mx-auto max-w-7xl p-4">
  <section id="hubView">
    <div class="mb-6 flex flex-col justify-between gap-4 md:flex-row md:items-end">
      <div><p class="text-sm text-indigo-300">ROOM HUB</p><h2 class="mt-1 text-3xl font-bold">Create or join a call</h2></div>
      <button id="openCreate" class="rounded-xl bg-indigo-500 px-5 py-3 font-semibold">+ Create room</button>
    </div>
    <div id="roomList" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
    <div id="emptyHub" class="mt-10 hidden rounded-2xl border border-dashed border-slate-700 py-16 text-center text-slate-400">No active rooms yet.</div>
  </section>

  <section id="callView" class="hidden">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
      <div><p class="text-xs text-slate-400">ROOM</p><h2 id="roomTitle" class="text-xl font-bold"></h2></div>
      <div class="flex gap-2">
        <button id="muteBtn" class="rounded-lg bg-slate-800 px-3 py-2 text-sm">Mute</button>
        <button id="videoBtn" class="rounded-lg bg-slate-800 px-3 py-2 text-sm">Camera off</button>
      </div>
    </div>
    <div class="grid gap-4 lg:grid-cols-[1fr_330px]">
      <div id="videos" class="video-grid min-h-[300px] gap-3"></div>
      <aside class="flex h-[520px] flex-col rounded-2xl border border-white/10 bg-slate-900/70">
        <div class="border-b border-white/10 p-4 font-semibold">Chat</div>
        <div id="messages" class="flex-1 space-y-3 overflow-y-auto p-4"></div>
        <form id="chatForm" class="flex gap-2 border-t border-white/10 p-3">
          <input id="chatInput" class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 outline-none" placeholder="Message…" autocomplete="off">
          <button class="rounded-lg bg-indigo-500 px-4 font-semibold">Send</button>
        </form>
      </aside>
    </div>
  </section>
</main>

<dialog id="createDialog" class="w-[92%] max-w-md rounded-2xl border border-white/10 bg-slate-900 p-0 text-slate-100 backdrop:bg-black/70">
  <form id="createForm" class="p-6"><h3 class="mb-5 text-xl font-bold">Create a room</h3>
    <label class="mb-3 block text-sm">Display name<input id="createName" required maxlength="24" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"></label>
    <label class="mb-3 block text-sm">Room name<input id="createRoomName" required maxlength="40" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"></label>
    <label class="mb-5 block text-sm">Password <span class="text-slate-400">(optional)</span><input id="createPassword" type="password" maxlength="64" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"></label>
    <div class="flex justify-end gap-2"><button type="button" id="closeCreate" class="rounded-lg px-4 py-2 text-slate-300">Cancel</button><button class="rounded-lg bg-indigo-500 px-5 py-2 font-semibold">Create</button></div>
  </form>
</dialog>

<dialog id="joinDialog" class="w-[92%] max-w-md rounded-2xl border border-white/10 bg-slate-900 p-0 text-slate-100 backdrop:bg-black/70">
  <form id="joinForm" class="p-6"><h3 id="joinTitle" class="mb-5 text-xl font-bold">Join room</h3>
    <label class="mb-3 block text-sm">Display name<input id="joinName" required maxlength="24" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"></label>
    <div id="passwordWrap" class="mb-5 hidden"><label class="block text-sm">Password<input id="joinPassword" type="password" maxlength="64" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"></label></div>
    <div class="flex justify-end gap-2"><button type="button" id="closeJoin" class="rounded-lg px-4 py-2 text-slate-300">Cancel</button><button class="rounded-lg bg-indigo-500 px-5 py-2 font-semibold">Join</button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const HUB_KEY = 'peerhub.rooms.v1';
const SIGNAL_KEY = 'peerhub.signal.v1';
const MAX_USERS = 5;
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('peerhub-broadcast-v1') : null;
let localStream, roomId, displayName;
const myId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
const peers = new Map();
const dataChannels = new Map();
let heartbeatTimer, pendingJoin;

function getRooms(){try{return JSON.parse(localStorage.getItem(HUB_KEY)||'{}')}catch{return{}}}
function saveRooms(x){localStorage.setItem(HUB_KEY,JSON.stringify(x))}
async function hashPassword(value){
  if(!value)return '';
  const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));
  return [...new Uint8Array(bytes)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}

function addVideo(id,name,stream,mirror=false){
  let el=document.getElementById('video-'+id);
  if(!el){el=document.createElement('div');el.id='video-'+id;el.className='relative overflow-hidden rounded-2xl border border-white/10 bg-slate-900';el.innerHTML='<video autoplay playsinline class="h-full min-h-[220px] w-full object-cover"></video><div class="absolute bottom-2 left-2 rounded bg-black/60 px-2 py-1 text-sm"></div>';$('#videos').appendChild(el)}
  el.querySelector('video').srcObject=stream;
  el.querySelector('video').classList.toggle('mirrored',mirror);
  el.querySelector('div').textContent=name;
}
function removeVideo(id){document.getElementById('video-'+id)?.remove()}

async function startMedia(){
  localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  addVideo(myId,displayName+' (You)',localStream,true);
}

function makePeer(remoteId,remoteName,initiator=false){
  if(peers.has(remoteId))return peers.get(remoteId);
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  peers.set(remoteId,pc);
  localStream?.getTracks().forEach(track=>pc.addTrack(track,localStream));
  pc.ontrack=e=>addVideo(remoteId,remoteName,e.streams[0]);
  pc.onicecandidate=e=>{if(e.candidate)sendSignal(remoteId,{type:'candidate',candidate:e.candidate})};
  pc.onconnectionstatechange=()=>{if(['disconnected','failed','closed'].includes(pc.connectionState))closePeer(remoteId)};
  if(initiator){setupDataChannel(remoteId,pc.createDataChannel('chat'))}
  else pc.ondatachannel=e=>setupDataChannel(remoteId,e.channel);
  return pc;
}
function setupDataChannel(remoteId,dc){
  dataChannels.set(remoteId,dc);
  dc.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='chat')addMessage(m.name,m.text,false)}catch{}};
}
function closePeer(id){peers.get(id)?.close();peers.delete(id);dataChannels.delete(id);removeVideo(id)}

function sendSignal(target,data){
  const packet={...data,from:myId,name:displayName,to:target,roomId,nonce:crypto.randomUUID?crypto.randomUUID():Math.random()};
  bc?.postMessage(packet);
  localStorage.setItem(SIGNAL_KEY,JSON.stringify(packet));
}
async function handleSignal(p){
  if(p.roomId!==roomId||p.from===myId)return;
  if(p.to!=='*'&&p.to!==myId)return;
  if(p.type==='hello'&&p.to==='*'){
    const pc=makePeer(p.from,p.name,true);
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);sendSignal(p.from,{type:'offer',sdp:pc.localDescription});
  }else if(p.type==='offer'){
    const pc=makePeer(p.from,p.name,false);await pc.setRemoteDescription(p.sdp);
    const answer=await pc.createAnswer();await pc.setLocalDescription(answer);sendSignal(p.from,{type:'answer',sdp:pc.localDescription});
  }else if(p.type==='answer'&&peers.has(p.from)){
    await peers.get(p.from).setRemoteDescription(p.sdp);
  }else if(p.type==='candidate'&&peers.has(p.from)){
    try{await peers.get(p.from).addIceCandidate(p.candidate)}catch{}
  }else if(p.type==='leave')closePeer(p.from);
}
bc&&(bc.onmessage=e=>handleSignal(e.data));
window.addEventListener('storage',e=>{if(e.key===SIGNAL_KEY&&e.newValue){try{handleSignal(JSON.parse(e.newValue))}catch{}}if(e.key===HUB_KEY)renderHub()});

function updatePresence(){
  if(!roomId)return;
  const rooms=getRooms(),r=rooms[roomId];if(!r)return;
  r.members=r.members||{};r.members[myId]={name:displayName,lastSeen:Date.now()};
  r.count=Object.values(r.members).filter(m=>Date.now()-m.lastSeen<20000).length;
  saveRooms(rooms);
}
function renderHub(){
  const now=Date.now(),rooms=getRooms();let changed=false;
  for(const[id,r]of Object.entries(rooms)){r.members=r.members||{};for(const[uid,m]of Object.entries(r.members))if(now-m.lastSeen>20000){delete r.members[uid];changed=true}r.count=Object.keys(r.members).length;if(!r.count){delete rooms[id];changed=true}}
  if(changed)saveRooms(rooms);
  const ids=Object.keys(rooms).sort((a,b)=>(rooms[b].count||0)-(rooms[a].count||0));
  $('#roomList').innerHTML='';$('#emptyHub').classList.toggle('hidden',ids.length>0);
  ids.forEach(id=>{const r=rooms[id],card=document.createElement('article');card.className='rounded-2xl border border-white/10 bg-slate-900/60 p-5';
    card.innerHTML=`<div class="flex items-start justify-between"><div><h3 class="font-bold">${escapeHtml(r.name)}</h3><p class="mt-1 text-xs text-slate-400">${r.password?'Password protected':'Open room'} · ${r.count}/${MAX_USERS} users</p></div><span class="rounded-full ${r.password?'bg-amber-500/20 text-amber-300':'bg-emerald-500/20 text-emerald-300'} px-2 py-1 text-xs">${r.password?'Private':'Public'}</span></div><button class="mt-5 w-full rounded-lg ${r.count>=MAX_USERS?'cursor-not-allowed bg-slate-700':'bg-indigo-500'} py-2 font-semibold" ${r.count>=MAX_USERS?'disabled':''}>Join room</button>`;
    card.querySelector('button').onclick=()=>openJoin(id,r);$('#roomList').appendChild(card);
  });
}
function openJoin(id,r){pendingJoin={id,r};$('#joinTitle').textContent='Join '+r.name;$('#passwordWrap').classList.toggle('hidden',!r.password);$('#joinPassword').value='';$('#joinDialog').showModal()}

$('#openCreate').onclick=()=>$('#createDialog').showModal();
$('#closeCreate').onclick=()=>$('#createDialog').close();
$('#closeJoin').onclick=()=>$('#joinDialog').close();
$('#createForm').onsubmit=async e=>{
  e.preventDefault();const name=$('#createName').value.trim(),roomName=$('#createRoomName').value.trim(),password=$('#createPassword').value;if(!name||!roomName)return;
  displayName=name;
  try{await startMedia()}catch(err){alert('Camera/microphone permission is required: '+err.message);return}
  roomId='room-'+(crypto.randomUUID?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10));
  const rooms=getRooms();rooms[roomId]={name:roomName,password:await hashPassword(password),members:{},created:Date.now(),count:0};saveRooms(rooms);enterRoom(roomName);$('#createDialog').close();
};
$('#joinForm').onsubmit=async e=>{
  e.preventDefault();const name=$('#joinName').value.trim();if(!name||!pendingJoin)return;const r=pendingJoin.r;
  if(r.password&&await hashPassword($('#joinPassword').value)!==r.password){alert('Incorrect password');return}
  const rooms=getRooms(),live=rooms[pendingJoin.id];if(!live){alert('Room no longer exists');return}live.members=live.members||{};
  const active=Object.entries(live.members).filter(([,m])=>Date.now()-m.lastSeen<20000);if(active.length>=MAX_USERS){alert('This room is full');return}
  displayName=name;
  try{await startMedia()}catch(err){alert('Camera/microphone permission is required: '+err.message);return}
  roomId=pendingJoin.id;enterRoom(r.name);$('#joinDialog').close();sendSignal('*',{type:'hello'});
};

function enterRoom(name){
  $('#hubView').classList.add('hidden');$('#callView').classList.remove('hidden');$('#leaveBtn').classList.remove('hidden');$('#roomTitle').textContent=name+' · '+roomId;
  updatePresence();heartbeatTimer=setInterval(updatePresence,5000);renderHub();
}
function leaveRoom(){
  sendSignal('*',{type:'leave'});clearInterval(heartbeatTimer);peers.forEach(pc=>pc.close());peers.clear();dataChannels.clear();
  const rooms=getRooms(),r=rooms[roomId];if(r?.members){delete r.members[myId];r.count=Object.keys(r.members).length;if(!r.count)delete rooms[roomId];else rooms[roomId]=r}saveRooms(rooms);
  localStream?.getTracks().forEach(t=>t.stop());document.querySelectorAll('[id^="video-"]').forEach(el=>el.remove());roomId=null;
  $('#hubView').classList.remove('hidden');$('#callView').classList.add('hidden');$('#leaveBtn').classList.add('hidden');$('#messages').innerHTML='';renderHub();
}
$('#leaveBtn').onclick=leaveRoom;
$('#muteBtn').onclick=()=>{const t=localStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('#muteBtn').textContent=t.enabled?'Mute':'Unmute'}};
$('#videoBtn').onclick=()=>{const t=localStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$('#videoBtn').textContent=t.enabled?'Camera off':'Camera on'}};

function addMessage(name,text,own=false){const div=document.createElement('div');div.className=own?'ml-8 rounded-lg bg-indigo-500/20 p-3':'mr-8 rounded-lg bg-slate-800 p-3';div.innerHTML=`<div class="text-xs text-slate-400">${escapeHtml(name)}</div><div class="mt-1 break-words">${escapeHtml(text)}</div>`;$('#messages').appendChild(div);$('#messages').scrollTop=$('#messages').scrollHeight}
$('#chatForm').onsubmit=e=>{e.preventDefault();const input=$('#chatInput'),text=input.value.trim();if(!text)return;addMessage(displayName,text,true);const msg={type:'chat',name:displayName,text};dataChannels.forEach(dc=>{if(dc.readyState==='open')dc.send(JSON.stringify(msg))});input.value=''};

window.addEventListener('beforeunload',()=>{if(roomId)sendSignal('*',{type:'leave'})});
renderHub();setInterval(renderHub,5000);
</script>
</body>
</html>
